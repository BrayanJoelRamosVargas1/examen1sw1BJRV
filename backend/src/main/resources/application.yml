spring:
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  application:
    name: uml-case-backend

  # ── Base de datos ───────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:umlcase}
    username: ${DB_USER:umlcase}
    password: ${DB_PASSWORD:umlcase}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Fase 1: Usamos Flyway, JPA solo valida el esquema
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway ──────────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration, classpath:db/dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${UMLCASE_DB_PORT:5433}/${DB_NAME:umlcase}

# ── Servidor ─────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# ── CORS (Angular local en :4200) ─────────────────────────────────────────────
# Configuración CORS prevista para fase posterior, aquí solo el origen permitido en dev
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
