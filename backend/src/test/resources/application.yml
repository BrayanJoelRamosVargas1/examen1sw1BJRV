spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Flyway desactivado para tests con H2 (ddl-auto: create-drop)
  # Los tests con Testcontainers usan @DynamicPropertySource para sobrescribir
  flyway:
    enabled: false
